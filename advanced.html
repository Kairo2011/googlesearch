
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pokročilé vyhledávání KairoGoogle.">
    <title>Pokročilé vyhledávání | KairoGoogle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <a class="brand-small" href="index.html">Google<span>kairo</span></a>
        <nav>
            <a href="index.html">Vyhledávání</a>
            <a href="images.html">Obrázky</a>
            <a href="forms.html">Formuláře</a>
            <a href="portfolio.html">Portfolio</a>
        </nav>
    </header>

    <main class="content-page">
        <section class="page-heading">
            <p class="eyebrow">KAIROGOOGLE / NASTAVENÍ</p>
            <h1>Pokročilé <span>vyhledávání</span></h1>
            <p>Upřesni vyhledávání pomocí několika různých podmínek.</p>
        </section>

        <section class="glass-panel">
            <form action="https://www.google.com/search" method="get" class="advanced-form">
                <div class="form-field">
                    <label for="all-words">Všechna tato slova</label>
                    <input id="all-words" type="text" name="as_q"
                           placeholder="Slova, která musí být ve výsledku">
                </div>

                <div class="form-field">
                    <label for="exact-phrase">Přesná fráze</label>
                    <input id="exact-phrase" type="text" name="as_epq"
                           placeholder="Přesné slovní spojení">
                </div>

                <div class="form-field">
                    <label for="any-words">Alespoň jedno z těchto slov</label>
                    <input id="any-words" type="text" name="as_oq"
                           placeholder="Několik slov oddělených mezerou">
                </div>

                <div class="form-field">
                    <label for="excluded-words">Žádné z těchto slov</label>
                    <input id="excluded-words" type="text" name="as_eq"
                           placeholder="Slova, která nechceš ve výsledcích">
                </div>

                <button type="submit" class="primary-button">Spustit pokročilé vyhledávání</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">

        </div>
    </footer>
</body>
</html>
