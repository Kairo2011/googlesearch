
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ukázka HTML formulářových prvků na KairoGoogle.">
    <title>HTML formuláře | KairoGoogle</title>
    <link rel="stylesheet" href="style.css">
    <script src="forms.js" defer></script>
</head>
<body>
    <header class="topbar">
        <a class="brand-small" href="index.html">Google<span>kairo</span></a>
        <nav>
            <a href="index.html">Vyhledávání</a>
            <a href="images.html">Obrázky</a>
            <a href="advanced.html">Pokročilé</a>
            <a href="portfolio.html">Portfolio</a>
        </nav>
    </header>

    <main class="content-page">
        <section class="page-heading">
            <p class="eyebrow">KAIROGOOGLE / HTML</p>
            <h1>Ukázka <span>formulářů</span></h1>
            <p>Praktická ukázka různých HTML formulářových prvků.</p>
        </section>

        <section class="glass-panel">
            <form id="demo-form" class="advanced-form">
                <div class="form-field">
                    <label for="fullname">Jméno</label>
                    <input type="text" id="fullname" name="fullname"
                           placeholder="Zadej jméno" required>
                </div>

                <div class="form-field">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email"
                           placeholder="napriklad@email.cz" required>
                </div>

                <div class="form-field">
                    <label for="password">Heslo – demonstrační pole</label>
                    <input type="password" id="password" name="password"
                           placeholder="Ukázkové heslo">
                </div>

                <div class="form-field">
                    <label for="age">Věk</label>
                    <input type="number" id="age" name="age" min="1" max="120">
                </div>

                <div class="form-field">
                    <label for="birthday">Datum narození</label>
                    <input type="date" id="birthday" name="birthday">
                </div>

                <div class="form-field">
                    <label for="color">Oblíbená barva</label>
                    <input type="color" id="color" name="color" value="#7658ff">
                </div>

                <div class="form-field">
                    <label for="satisfaction">Jak se ti stránka líbí?</label>
                    <input type="range" id="satisfaction" name="satisfaction"
                           min="0" max="10" value="5">
                </div>

                <div class="form-field">
                    <label for="topic">Oblíbené téma</label>
                    <select id="topic" name="topic">
                        <option value="">Vyber možnost</option>
                        <option value="technology">Technologie</option>
                        <option value="sport">Sport</option>
                        <option value="games">Hry</option>
                        <option value="science">Věda</option>
                    </select>
                </div>

                <fieldset class="choice-group">
                    <legend>Jak často používáš internet?</legend>
                    <label><input type="radio" name="frequency" value="daily"> Každý den</label>
                    <label><input type="radio" name="frequency" value="sometimes"> Občas</label>
                    <label><input type="radio" name="frequency" value="rarely"> Zřídka</label>
                </fieldset>

                <fieldset class="choice-group">
                    <legend>Co tě zajímá?</legend>
                    <label><input type="checkbox" name="interests" value="technology"> Technologie</label>
                    <label><input type="checkbox" name="interests" value="sport"> Sport</label>
                    <label><input type="checkbox" name="interests" value="games"> Hry</label>
                </fieldset>

                <div class="form-field">
                    <label for="message">Vzkaz</label>
                    <textarea id="message" name="message" rows="5"
                              placeholder="Napiš svůj názor..."></textarea>
                </div>

                <div class="form-field">
                    <label for="file">Vybrat soubor</label>
                    <input type="file" id="file" name="file">
                </div>

                <div class="form-actions">
                    <button type="submit" class="primary-button">Odeslat ukázku</button>
                    <button type="reset" class="secondary-button">Vymazat formulář</button>
                </div>

                <p id="form-result" class="form-result" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <span>© 2026 KairoGoogle</span>
        <div>
            <a href="portfolio.html">Portfolio</a>
            <a href="citace.html">Citace</a>
            <a href="citace.md">Citace MD</a>

            <a href="https://jigsaw.w3.org/css-validator/validator?uri=https%3A%2F%2Fkairo2011.github.io%2Fgooglesearch%2Fstyle.css">CSS validátor</a>
        </div>
    </footer>
</body>
</html>
